# Render Blueprint — free web service via Docker runtime.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: rsc-extraction-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 10000
